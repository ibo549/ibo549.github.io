<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#00FF41" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="80" ry="80" fill="#1a1b2e"/>
  <!-- Terminal cursor block -->
  <rect x="186" y="126" width="140" height="260" rx="8" ry="8" fill="#00FF41" filter="url(#glow)"/>
</svg>
